<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>星辉实习助手</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;overflow:hidden;height:100vh}
.app{display:flex;flex-direction:column;height:100%}
.nav{display:flex;background:#fff;border-bottom:1px solid #e0e0e0}
.nbtn{flex:1;text-align:center;padding:12px 0;font-size:14px;color:#666;border:none;background:0;cursor:pointer}
.nbtn.active{color:#1890ff;border-bottom:2px solid #1890ff}
.page{display:none;flex:1;overflow-y:auto}
.page.active{display:flex;flex-direction:column}
.chat-msgs{flex:1;padding:16px;overflow-y:auto}
.msg{margin-bottom:12px;max-width:85%;padding:10px 14px;border-radius:16px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg.user{float:right;background:#1890ff;color:#fff;border-radius:16px 16px 4px 16px}
.msg.bot{float:left;background:#fff;border-radius:16px 16px 16px 4px;box-shadow:0 1px 4px rgba(0,0,0,0.1)}
.msg::after{content:"";display:table;clear:both}
.typing{display:none;justify-content:center;padding:10px}
.td{width:8px;height:8px;background:#999;border-radius:50%;margin:0 2px;animation:wave 1s infinite}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.quick-btns{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;background:#fff;border-top:1px solid #e0e0e0}
.qbtn{flex:1;min-width:45%;padding:8px 12px;background:#f0f0f0;border:none;border-radius:16px;font-size:13px;cursor:pointer}
.inp-area{background:#fff;padding:12px 16px;border-top:1px solid #e0e0e0}
.inp-row{display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;padding:10px 14px;border:1px solid #ddd;border-radius:20px;resize:none;font-size:14px;outline:none;max-height:120px}
textarea:focus{border-color:#1890ff}
.sbtn{width:44px;height:44px;border:none;background:#1890ff;color:#fff;border-radius:50%;font-size:20px;cursor:pointer}
.filters{display:flex;gap:8px;padding:12px;background:#fff;border-bottom:1px solid #e0e0e0;flex-wrap:wrap}
.filters select{flex:1;min-width:30%;padding:8px;border:1px solid #ddd;border-radius:4px;font-size:13px}
.result{flex:1;padding:12px;overflow-y:auto}
.count{text-align:center;padding:8px;color:#999;font-size:13px}
.card{background:#fff;border-radius:8px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,0.08);cursor:pointer}
.card:active{background:#f9f9f9}
.card-co{font-weight:600;font-size:15px;color:#333;margin-bottom:4px}
.card-pos{font-size:13px;color:#666;margin-bottom:6px}
.tag{display:inline-block;background:#e6f7ff;color:#1890ff;padding:2px 8px;border-radius:10px;font-size:11px;margin-right:6px}
.card-meta{font-size:12px;color:#999;margin-top:6px}
.drawer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:16px 16px 0 0;max-height:85vh;transform:translateY(100%);transition:transform .3s;z-index:100}
.drawer.open{transform:translateY(0)}
.drawer-hd{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid #e0e0e0}
.drawer-hd h3{flex:1;font-size:16px}
.close-btn{width:32px;height:32px;border:none;background:#f5f5f5;border-radius:50%;font-size:18px;cursor:pointer}
.drawer-body{padding:16px;overflow-y:auto;max-height:calc(85vh - 60px)}
.row{display:flex;padding:10px 0;border-bottom:1px solid #f0f0f0}
.row-lbl{color:#999;font-size:13px;width:70px}
.row-val{color:#333;font-size:14px;flex:1}
.greet{padding:20px}
.greet h1{font-size:22px;color:#333;margin-bottom:12px}
.greet p{color:#666;font-size:14px;line-height:1.6;margin-bottom:8px}
.greet small{color:#999;font-size:12px}
</style>
</head>
<body>

    </div>
  </div>
  <div id="page-search" class="page">

    </div>
    <div class="result">
      <div class="count" id="count">加载中...</div>
      <div id="cards"></div>
    </div>
  </div>
</div>
<div class="drawer" id="drawer">
  <div class="drawer-hd"><h3 id="drawer-title">详情</h3><button class="close-btn" onclick="closeDrawer()">×</button></div>

淡水、食物、空气、瓶装水和自来水等来源中都可以检测到不同浓度的塑料微粒。微塑料作为一种新型的污染物，具有分布广、降解慢、毒理复杂等特点，已成为全球环境科学的研究热点。环境中微塑料的污染形势和环境健康十分严峻，随着每天有越来越多的塑料以前所未有的速度进入自然环境，迫切需要重新考虑在生活中、在企业中，何时以及如何使用塑料。研究表明，微塑料除了本身所含有的有毒化学物质外，由于其具有表面带电荷、高比表面积和疏水性等特性，能吸附很多有害物质，也可作为载体运输不同类型的污染物如重金属等。通过本项目学习，学员将了解周边环境中微塑料特性及其与环境健康的关系，掌握微塑料的基本理化特性；学习微塑料的鉴别、污染特性和细胞毒理分析的基本要求和流程，掌握细胞毒理/活性分析的基本操作；通过文献阅读与动手实验结合，培养科研报告写作能力，养成良好的科研习惯。", "type": "远程人事"}, {"industry": "", "company": "", "position": "电动汽车超级快充技术研究", "form": "远程", "duration": "", "location": "企业邮箱推荐信+实习证明", "benefits": "无系统", "requirements": "无对外公开岗位，支持内推", "price12m": "简历评估+面试（根据简历情况", "price3m": "8000", "jd": "不变", "note": "中科院电工所：电动汽车超级快充技术研究\n\n电动汽车作为新一代环保型交通工具，世界各国政府纷纷制定战略并出台相关政策刺激电动汽车产业的快速发展。随着电动汽车数量的快速增长，充电时长和里程焦虑问题越来越成为制约电动汽车产业发展的严重问题，而缩短充电时间被认为是使更多人能够使用电动汽车的一个关键目标。本实习项目的的研究目标在已有快充拓扑电路的基础上对电路拓扑结构作进一步的改进与优化，主要研究方向是在V2G双向功率变换器拓扑电路的基础上，设计一个电动汽车快充电路，使得其能够实现300kW以上的充电功率，同时保持DC/DC变换器系统小信号传输的稳定性，达到稳定快充的目的。", "type": "远程人事"}, {"industry": "", "company": "", "position": "新型电力系统综合能源系统研究", "form": "远程", "duration": "", "location": "企业邮箱推荐信+实习证明", "benefits": "无系统", "requirements": "无对外公开岗位，支持内推", "price12m": "简历评估+面试（根据简历情况", "price3m": "8000", "jd": "不变", "note": "中科院电工所：新型电力系统综合能源系统研究\n\n岗位要求：\n1、热爱科研工作，有较强的学习能力、执行力、创新能力及逻辑思维能力，能熟练检索国内外相关文献，有独立的想法与见解；\n2、具有电气工程或汽车工程相关专业背景。\n适合专业：电气工程、汽车工程等相关专业\n实习目标\n新型电力系统储能技术研究聚焦大规模、高安全、长寿命技术突破，旨在平抑新能源波动，提升电网灵活性与可靠性，是实现“双碳”目标的关键支撑。\n第1-2周，调研以新能源为主体新型配电网发展概况和典型特征，形成1-5页调研报告；\n第3-4周，调研能量型储能和功率型储能典型特征（特别是电化学储能），形成1-5页调研报告；\n第5-6周，开展典型应用场景（港区/零碳园区/偏远乡村三选一）的混合储能规划研究，形成1-10页研究报告；\n第7-8周，完成典型应用场景（港区/零碳园区/偏远乡村三选一）的混合储能优化配置研究，形成1-10页研究报告。\n", "type": "远程人事"}, {"industry": "", "company": "", "position": "配电网电化学储能系统研究", "form": "远程", "duration": "", "location": "企业邮箱推荐信+实习证明", "benefits": "无系统", "requirements": "无对外公开岗位，支持内推", "price12m": "简历评估+面试（根据简历情况", "price3m": "8000", "jd": "不变", "note": "中科院电工所：配电网电化学储能系统研究\n\n随着全球可再生能源的普及应用、电动汽车产业的迅速发展以及智能电网的建设，储能技术成为制约抑或促进能源发展的关键环节。储能技术是一项可能对未来能源系统发展及运行带来革命性变化的技术。在众多储能技术中，技术进步最快的是电化学储能技术。以锂离子电池、超级电容器等为主导的电 ent.\n-Fintech Exploration: Research the applications of Generative AI (Gen AI) and Agentic AI Systems in financial markets, and sort out relevant cases and cutting-edge developments.\n-Market Dynamics Monitoring: Monitor important information such as Federal Reserve policies, inflation trends, and market risks, promptly summarize and write brief analyses to provide references for the team's decision-making.\n-Educational Content Assistance: Assist in organizing and promoting educational content, including webinars, expert sharing sessions, and other activities, and participate in pre-preparation, information release, and follow-up summary work.", "benefits": "https://www.linkedin.com/company/the-beryl-consulting-group/\n\n--------\nhttps://www.berylconsulting.com/content/beryl-ventures", "requirements": "远程实习：4周/8周/12周", "price12m": "远程实习：\n4周14000元 / 8周17000元/12周20000元", "price3m": "官方offer、推荐信、实习证明、支持背调", "jd": "免费支持CPT、OPT（+100美金)", "note": "否", "type": "美国实习"}, {"industry": "", "company": "", "position": "", "form": "数字资产实习生 Digital Assets Internship", "duration": "岗位职责：\n1、数字资产数据收集与分析：从数字资产交易平台、区块链浏览器等渠道收集比特币、以太坊等各类数字资产的价格、交易量、持仓量等数据，进行清洗、整理和初步分析，追踪其市场表现与波动情况。\n2、行业动态监测：关注数字资产领域的政策法规、技术创新（如 Layer2 解决方案、跨链技术等）、市场趋势及主要参与者动态，整理相关信息并形成简报，为团队了解行业发展提供支持。\n3、风险与机会评估：协助分析数字资产投资中的潜在风险，如市场波动性、监管政策变化、技术安全等，同时挖掘新兴数字资产及相关项目的投资机会，提供初步评估意见。\n4、内容整理与支持：收集整理数字资产领域专家观点、行业报告等资料，协助制作数字资产市场分析简报，为内部讨论和客户沟通提供素材。\n5、数据可视化辅助：协助将数字资产相关数据转化为简洁明了的图表，如价格趋势折线图、交易量柱状图等，助力团队更直观地理解市场动态。", "location": "Digital Assets Internship\nJob Responsibilities:\n-Digital Asset Data Collection and Analysis: Collect data such as prices, trading volumes, and holdings of various digital assets like Bitcoin and Ethereum from digital asset trading platforms, blockchain browsers, and other channels. Clean, organize, and conduct preliminary analysis of the data to track their market performance and fluctuations.\n-Industry Dynamics Monitoring: Pay attention to policies and regulations, technological innovations industry": "", "company": "", "position": "", "form": "UX/UI 设计师 UX/UI Designer", "duration": "岗位概述：\n-作为 inGen Dynamics 的 UX/UI 设计师，您将负责公司数字产品的用户界面与用户体验设计。该岗位需与产品经理、开发人员及其他相关方紧密协作，打造兼具直观性与美感的设计方案，提升用户满意度。\n\n核心职责：\n-设计网页及移动应用的用户界面\n-开展用户研究，洞察用户需求与偏好\n-制作线框图、原型及设计稿，传递设计构想\n-与开发团队协作，确保设计方案高效落地\n\n职业发展路径与机会：\n-从 UX/UI 设计师起步，未来可向高级 UX/UI 设计师、产品设计师或用户体验研究员等方向进阶。随着数字产品与服务的蓬勃发展，市场对资深 UX/UI 设计人才的需求持续增长，职业机会广泛覆盖科技公司、初创企业乃至自由咨询领域。\n\n可积累的技能与经验：\n\n-用户研究：掌握通过调研指导设计决策的能力\n-线框与原型设计：积累设计方案可视化呈现的实战经验\n-协作能力：与跨职能团队紧密配合，推动设计方案落地成型\n-设计工具：熟练运用 Sketch、Figma、Adobe XD 等行业主流设计工具", "location": "Role Overview: \n- As a UX/UI Designer at inGen Dynamics, you will design user interfaces and experiences for the company’s digital products. This role involves \nworking closely with product managers, developers, and other stakeholders to create intuitive and aesthetically pleasing designs that enhance user \nsatisfaction. \n\nKey Responsibilities: \n- Design user interfaces for web and mobile applications. \n- Conduct user research to understand user needs and preferences. \n- Create wireframes, prototypes, and mockups to communicate design ideas. \n- Collaborate with developers to ensure that designs are implemented effectively. \n\nCareer Path and Opportunities: \nExperience as a UX/UI Designer opens doors to advanced roles such as Senior UX/UI Designer, Product Designer, or UX Researcher. With the rise \nof digital products and services, the demand for skilled UX/UI designers continues to grow, offering opportunities in tech companies, startups, and \neven freelance consulting. \n\nSkills and Experience Gained: \n- User Research: Learn to conduct research to inform design decisions. \n- Wireframing and Prototyping: Gain experience in creating visual representations of designs. \n- Collaboration: Work closely with cross-functional teams to bring designs to life. \n- Design Tools: Develop proficiency in industry-standard design tools like Sketch, Figma, and Adobe XD.", "benefits": "", "requirem e in designing and delivering training programs for various audiences. \n- Instructional Design: Learn to develop effective training materials, including presentations, manuals, and online courses. \n- Workshop Facilitation: Develop skills in conducting workshops and training sessions on a wide range of topics. \n- Evaluation: Learn to evaluate the effectiveness of training initiatives and make data-driven improvements", "benefits": "", "requirements": "远程实习：4周/8周/12周", "price12m": "远程实习：\n4周14000元 / 8周16000元/12周18000元", "price3m": "官方offer、推荐信、实习证明、支持背调", "jd": "免费支持CPT，OPT（+100美金）", "note": "否", "type": "美国实习"}, {"industry": "", "company": "", "position": "", "form": "PHP开发 PHP Developer", "duration": "岗位概述：\n-作为 inGen Dynamics 的 PHP 开发工程师，您将负责使用 PHP 编程语言编写服务器端 Web 应用逻辑。该岗位需参与后端组件开发、应用与第三方网络服务的对接，以及前端开发成果与后端逻辑的集成工作。\n\n核心职责：\n\n-编写清晰规范、文档完善的 PHP 代码\n-开发后端组件，并实现应用与第三方网络服务的连接\n-将前端开发成果与服务器端逻辑进行集成\n-对核心产品软件及数据库进行故障排查、测试与维护\n\n职业发展路径与机会：\n-从 PHP 开发工程师起步，未来可向高级 PHP 开发工程师、全栈开发工程师或软件工程师等方向发展。PHP 在 Web 开发领域持续占据重要地位，尤其在动态网站与应用构建方面应用广泛，为职业晋升提供丰富机会。\n\n可积累的技能与经验：\n\n-Web 开发：掌握服务器端编程与 Web 开发专业技能\n-PHP 编程：学会编写高效且具备可扩展性的 PHP 代码\n-协作能力：与前端开发人员紧密配合，打造功能连贯的 Web 应用\n-问题排查：通过调试与优化 PHP 应用，培养扎实的问题解决能力", "location": "Role Overview: \n- As a PHP Developer at inGen Dynamics, you will be responsible for writing server-side web application logic using the PHP programming language. \nThis role involves developing back-end components, connecting the application with third-party web services, and integrating front-end developers’ \nwork. \n\nKey Responsibilities: \n- Write clean, well-documented PHP code. \n- Develop back-end components and connect the application with third-party web services. \n- Integrate front-end developer work with the server-side logic. \n- Troubleshoot, test, and maintain the core product software and databases. \n\nCareer Path and Opportunities: \nStarting as a PHP Developer can lead to roles such as Senior PHP Developer, Full-Stack Developer, or Software Engineer. PHP remains a popular \nlanguage for web development, particularly for building dynamic websites and applications, offering numerous career advancement opportunities. \n\nSkills and Experience Gained: \n- Web Development: Gain expertise in server-side programming and web development. \n- PHP Programming: Learn to write efficient and scalable PHP code. \n- Collaboration: Work closely with front-end developers to create cohesive web applications. \n- Troubleshooting: Develop problem-solving skills by debugging and optimizing PHP applications.", "benefits": "", "requirements": "远程实习：4周/8周/12周", "price12m": "远程实习：\n4周14000元 / 8周16000元/12周18000元", "price3m": "官方offer、推荐信、实习证明、支持背调", "jd": "免费支持CPT，OPT（+100美金）", "note": "否", "type": "美国实习"}, {"industry": "", "company": "", "position": "", "form": "机械工程师 Mechanical Engineer", "duration": "岗位概述：\n-作为 inGen Dynamics 的机械工程师，您将负责机器人及自动化产品中机械零部件与系统的设计、开发及测试工作。该岗位需与硬件工程师、软件工程师紧密协作，打造坚固耐用且高效的机械解决方案。\n\n核心职责：\n\n-设计并开发适用于机器人及自动化领域的机械零部件与系统\n-对机械设计进行测试与验证，确保其符合性能及耐久性标准\n-与硬件、软件工程师协作，实现机械系统与其他组件的集成\n-在开发及生产阶段排查并解决机械相关问题\n\n职业发展路径与机会：\n-凭借机械工程师的工作经验，未来可向高级机械工程师、机械设计工程师或机器人工程师等高阶岗位发展。该岗位培养的技能在汽车、航空航天、制造业等多个行业均有广泛应用，为长期职业发展奠定坚实基础。\n\n可积累的技能与经验：\n\n-机械设计：掌握机械零部件与系统的设计及开发专业技能\n-测试与验证：学会对机械设计的性能及耐久性进行测试与验证\n-协作能力：与跨职能团队配合，实现机械系统与软硬件的集成\n-问题解决：通过排查机械问题，培养扎实的问题解决能力", "location": "Role Overview: \nAs a Mechanical Engineer at inGen Dynamics, you will be responsible for designing, developing, and testing mechanical components and systems \nused in robotics and automation products. This role involves collaborating with hardware and software engineers to create robust and efficient \nmechanical solutions. \n\nKey Responsibilities: \n- Design and develop mechanical components and systems for robotics and automation. \n- Test and validate mechanical designs to ensure they meet performance and durability standards. \n- Collaborate with hardware and software engineers to integrate mechanical systems with other components. \n- Troubleshoot and resolve nning, executing, and overseeing projects from inception to completion. You will \ncollaborate with various teams to ensure that projects are delivered on time, within scope, and within budget. This role is crucial in maintaining the \noperational efficiency of the company’s initiatives. \nKey Responsibilities: \n- Coordinate project activities, resources, and information. \n- Develop and maintain project schedules, tracking progress and milestones. \n- Communicate with stakeholders to ensure clarity on project objectives and deliverables. \n- Identify and manage potential risks and issues. \nCareer Path and Opportunities: \nStarting as a Project Coordinator provides a solid foundation in project management, offering pathways to roles such as Project Manager, Program \nManager, or Operations Manager. With experience, you may also move into specialized project management roles in sectors like IT, construction, or \nhealthcare. The skills you develop in managing complex projects will be highly transferable across industries. \nSkills and Experience Gained: \n- Project Management: Develop expertise in planning, executing, and closing projects. \n- Time Management: Learn to manage time effectively to keep projects on track. \n- Risk Management: Gain skills in identifying and mitigating project risks. \n- Communication: Enhance your ability to coordinate between teams and stakeholders.", "benefits": "", "requirements": "远程实习：4周/8周/12周", "price12m": "远程实习：\n4周14000元 / 8周16000元/12周18000元", "price3m": "官方offer、推荐信、实习证明、支持背调", "jd": "免费支持CPT，OPT（+100美金）", "note": "否", "type": "美国实习"}, {"industry": "", "company": "", "position": "", "form": "业务发展Business Development", "duration": "岗位概述：\n-作为 inGen Dynamics 的业务拓展专员，您将通过挖掘新的商业机会、与潜在客户及合作伙伴建立关系，推动公司创新教育产品及机器人产品的增长。该岗位需与产品经理、营销团队及教育领域相关方紧密协作，扩大业务覆盖范围并优化项目落地效果。\n\n核心职责：\n-客户获取：通过人脉拓展、陌生拜访及演示等方式开发潜在客户，提升 “未来宇航员 B.Tech”“废品机器人” 等项目的采用率\n-合作伙伴开发：与教育机构、科技孵化器及其他相关组织建立战略合作伙伴关系，扩大市场覆盖\n-销售策略：制定并执行销售策略，向潜在客户有效传递产品价值\n-客户关系：维护并深化与现有客户的关系，确保 h deployment of new applications and updates. \n- Manage cloud infrastructure, ensuring security, scalability, and high availability. \n\nCareer Path and Opportunities: \nExperience as a DevOps Engineer can lead to roles such as Senior DevOps Engineer, Cloud Architect, or Infrastructure Manager. The demand for \nDevOps skills is growing rapidly as more companies move to cloud-based infrastructures, making this a critical and highly-valued career path. \n\nSkills and Experience Gained: \n- Automation: Learn to automate complex workflows and software deployment processes. \n- Cloud Management: Gain expertise in managing cloud infrastructure, including AWS, Azure, or Google Cloud. \n- Collaboration: Work closely with development teams to support software deployment. \n- Troubleshooting: Develop problem-solving skills by diagnosing and resolving infrastructure issues", "benefits": "", "requirements": "远程实习：4周/8周/12周", "price12m": "远程实习：\n4周14000元 / 8周16000元/12周18000元", "price3m": "官方offer、推荐信、实习证明、支持背调", "jd": "免费支持CPT，OPT（+100美金）", "note": "否", "type": "美国实习"}, {"industry": "", "company": "", "position": "", "form": "商业分析 Business Analyst", "duration": "岗位概述：\n-作为 inGen Dynamics 的业务分析师，您将负责分析业务流程、识别改进空间，并制定提升运营效率的策略。该岗位需与多个部门紧密协作，收集并分析数据，向高级管理层呈现可落地的洞察。您将成为业务端与技术团队之间的关键纽带，确保业务目标转化为成功的项目成果。\n\n核心职责：\n-开展详细的业务分析，梳理业务面临的问题、潜在机遇及解决方案\n-制定并监控数据质量指标，确保业务数据需求与报告需求得到满足\n-组织研讨会并与利益相关方沟通，理解其业务需求\n-通过定义项目需求与范围，支持项目管理工作\n\n职业发展路径与机会：\n-以 inGen Dynamics 的 MBA 业务分析师为起点，您将拥有广阔的职业发展空间。通过分析复杂业务问题、推动有效解决方案落地的实战经验，可晋升至高级业务分析师、业务咨询顾问乃至项目经理等岗位。随着经验积累，还能向业务战略经理或运营总监等战略型岗位发展，负责塑造公司整体业务策略。\n\n可积累的技能与经验：\n-数据分析：掌握分析海量数据的能力，运用 Excel、SQL、Power BI 等工具提炼可落地的洞察\n-项目管理：熟悉项目管理全流程，从范围界定到执行与报告\n-利益相关方管理：培养强大的沟通能力，与多元团队协作达成业务目标\n-问题解决：提升识别业务挑战并提出有效解决方案的能力", "location": "Role Overview: \n- As an Business Analyst at inGen Dynamics, you will be responsible for analyzing business processes, identifying areas for improvement, and \ndeveloping strategies to enhance operational efficiency. Your role involves w 概述：\n-作为 inGen Dynamics 的计算机视觉与深度学习实习生，您将投身于高级视觉智能系统的研发，致力于让机器能够感知、解读视觉输入并作出响应。您将开发和优化用于图像分类、目标检测、人脸识别及实时跟踪等任务的算法。该岗位连接深度学习研究与实际机器人应用（包括 Aido、Sentinel 和 Fari 机器人），实现技术从实验室到产品的落地。\n\n核心职责：\n-利用卷积神经网络（CNNs）和视觉 Transformer（ViTs）开发并微调计算机视觉模型\n-对图像和视频数据集进行标注、清洗与增强，用于模型训练和验证\n-实现实时目标检测、分割及姿态估计的处理流程\n-将模型集成到受边缘设备限制的生产环境中\n-在不同条件下测试算法，确保其稳健性和可扩展性\n\n职业发展路径与机会：\n-该岗位是进入计算机视觉、机器人、增强现实（AR）及自主系统等专业领域的理想起点。未来可晋升为计算机视觉工程师、机器人视觉科学家或专注于视觉领域的 AI 产品负责人。\n\n可积累的技能与经验：\n-视觉智能：掌握图像处理与深度视觉学习的核心技术\n-实战 AI 建模：运用 YOLO、Mask R-CNN、OpenCV 和 MediaPipe 等工具开展工作\n-边缘部署：针对移动设备和嵌入式设备（如 NVIDIA Jetson）优化模型\n-场景应用：在医疗、安防及教育机器人等场景中应用视觉模型", "location": "Role Overview: \n-As a Computer Vision & Deep Learning Intern at InGen Dynamics, you will work on advanced visual intelligence systems that enable machines to \nperceive, interpret, and respond to visual inputs. You’ll develop and optimize algorithms for tasks such as image classification, object detection, facial \nrecognition, and real-time tracking. This role bridges the gap between deep learning research and practical robotics applications, including Aido, Sentinel, \nand Fari. \n\nKey Responsibilities: \n-Develop and fine-tune computer vision models using convolutional neural networks (CNNs) and vision transformers (ViTs). \n-Annotate, clean, and augment image and video datasets for training and validation. \n-Implement real-time object detection, segmentation, and pose estimation pipelines. \n-Integrate models into production environments with edge device constraints. \n-Test algorithms under varying conditions to ensure robustness and scalability. \n\nCareer Path and Opportunities: \n-This role is ideal for entry into specialized careers in computer vision, robotics, augmented reality (AR), and autonomous systems. You may progress to \nroles like Computer Vision Engineer, Robotics Vision Scientist, or AI Product Lead with a vision specialization. \n\nSkills and Experience Gained: \n- Visual Intelligence: Learn core techniques in image processing and deep visual learning. \n- Hands-On AI Modeling: Work with YOLO, Mask R-CNN, OpenCV, and MediaPipe. \n- Edge Deployment: Optimize models for mobile and embedded devices (e.g., NVIDIA Jetson). \n- Use-Case Exposure: Apply vision models in healthcare, security, and education robotics", "benefits": "", "requirements": "远程实习：4周/8周/12周", "price12m": "远程实习：\n4周14000元 / 8周16000元/12周18000元", "price3m": "官方offer、推荐信、实习证明、支持背调", "jd": "免费支持CPT，OPT（+100美金）", "note": "否", "type": "美国实习"}, {"industry": "", "company": "", "position": "", "form": "人工智能安全性和可解释性实习生 Al Safety & Interpretability Intern", "duration": "岗位概述：\n-作为 inGen Dynamics 的人工智能安全与可解释性实习生，您将在确保 AI 系统的透明性、公平性及符合伦理准则方面发挥关键作用。您将参与评估模型稳健性、揭示算法偏见，并开发可解释 AI（XAI）方法。该岗位在医疗机器人（Fari）、自主监控系统（Sentinel）及教育平台（Senpai）等关键任务领域至关重要 —— 在这些场景中，理解 AI 的行为方式与追求其性能同等重要。\n\n核心职责：\n-对各类应用中的 AI 模型开展公平性与偏见审计\n-使用 SHAP、LIME 及 Captum 等工具构建可解释机器学习框架\n-制定安全基准与红队测试场景，在对抗性条件下测试模型表现\n-与研究、产品及政策团队协作，将伦理标准融入模型开发流程\n-记录模型决策过程，搭建可视化仪表盘，向非技术背景的利益相关方展示 AI 行为\n\n职业发展路径与机会：\n-该实习岗位为进入 AI 治理、负责任 AI 工程、AI 风险与合规及 AI 伦理研究等高度专业化领域铺平道路。它将为您未来在 AI 政策智库、政府实验室及强调 AGI（通用人工智能）安全部署的前沿科技公司工作奠定基础。\n\n可积累的技能与经验：\n-可解释 AI 技术：掌握使用白盒与黑盒可解释性方法解释模型决策的能力\n-伦理与治理：理解负责任 AI 的监管框架与哲学基础\n-偏见与公平性分析：学会检测、缓解算法偏见并向相关方沟通其影响\n-对抗性稳健性：探索 AI 系统在异常、欺骗性或意外输入下的行为模式", "location": "Role Overview: \n-As an AI Safety & Interpretability Intern at InGen Dynamics, you will play a critical role in ensuring that AI systems are transparent, fair, and aligned with \nethical guidelines. You will work on evaluating model robustness, uncovering algorithmic biases, and developing explainable AI (XAI) methods. This role is \nessential in mission-critical areas such as healthcare robotics (Fari), autonomous surveillance (Sentinel), and educational platforms (Senpai), where \nunderstanding AI behavior is as important as performance. \n\nKey Responsibilities: \n-Conduct fairness and bias audits on AI models across various applications. \n-Use tools like SHAP, LIME, and Captum to build interpretable machine learning frameworks. \n-Develop safety benchmarks and red-teaming scenarios to test models under adversarial conditions. \n-Collaborate with research, product, and policy teams to integrate ethical standards into model development. \n-Document model decisions and build dashboards that visualize AI behavior for non-technical stakeholders. \n\nCareer Path and Opportunities: \n-This internship opens pathways into highly specialized fields such as AI Governance, Responsible AI Engineering, AI Risk & Compliance, and AI Ethics \nResearch. It is a foundation for future work in organizations like AI policy think tanks, government labs, and frontier tech companies emphasizing safe \ndeployment of AGI. \n\nSkills and Experience Gained: \n-XAI Techniques: Learn to explain model decisions using white-box and black-box interpretability methods. \n-Ethics & Governance: Understand regulatory and philosophical frameworks for responsible AI. \n-Bias & Fairness Analysis: Learn how to detect, mitigate, and communicate algorithmic biases. \n-Adversarial Robustness: Explore how AI systems behave under unusual, deceptive, or unexpected inputs.", "benefits": "", "requirements": "远程实习：4周/8周/12周", "price12m": "远程实习：\n4周14000元 / 8周16000元/12周18000元", "price3m": "官方offer、推荐信、实习证明、支持背调", "jd": "免费支持CPT，OPT（+100美金）", "note": "否", "type": "美国实习"}, {"industry": "", "company": "", "position": "", "form": "自然语言处理(NLP)实习生 Natural Language Processing (NLP) Intern", "duration": "岗位概述：\n-作为 inGen Dynamics 的自然语言处理（NLP）实习生，您将投身于语言学与人工智能的交叉领域，助力机器理解和生成人类语言。工作内容涵盖构建智能聊天机器人、文本摘要工具，以及训练基于 Transformer 的语言模型等。该岗位为多款 AI 驱动产品的开发提供支持，包括特殊教育领域的 Senpai、老年护理助手 Fari，以及集成于 Origami AI 平台的对话代理。\n\n核心职责：\n-使用 Hugging Face Transformers、spaCy 等库构建并微调 NLP 模型\n-开展文本分类、情感分析、命名实体识别（NER）及文本摘要等任务\n-在大规模文本数据集（如 Common Crawl、Wikipedia）上训练并评估语言模型\n-优化针对大语言模型（LLMs）及生成式模型的提示词工程策略\n-与用户体验（UX）团队协作，改进对话式 AI 系统、语音助手及多语言机器人\n\n职业发展路径与机会：\n-该实习岗位可通向 NLP 工程师、对话式 AI 开发师、大语言模型研究员或 AI 语言学专家等职业方向。随着生成式 AI 的应用加速普及，NLP 专业人才在健康科技、教育科技、金融科技及法律 AI 等多个行业的需求日益旺盛。\n\n可积累的技能与经验：\n-语言建模：运用 BERT、GPT、T5 等 Transformer 架构开展工作\n-语言分析：接触句法、语义及语境层面的 NLP 技术\n-对话式 AI：使用 Rasa 或 LangChain 开发聊天机器人及对话系统\n-提示词工程：学习通过零样本、少样本及思维链提示等方式引导大语言模型输出", "location": "Role Overview: \n-As an NLP Intern at InGen Dynamics, you will work at the intersection of linguistics and artificial intelligence, helping machines understand and generate \nhuman language. Your tasks will range from building intelligent chatbots and text summarizers to training transformer-based language models. This role \nsupports the development of AI-powered products like Senpai (special needs education), Fari (eldercare assistant), and conversational agents integrated \nwith the Origami AI platform. \n\nKey Responsibilities: \n-Build and fine-tune NLP models using libraries such as Hugging Face Transformers or spaCy. \n-Conduct text classification, sentiment analysis, named entity recognition (NER), and summarization tasks. \n-Train and evaluate language models on large-scale text datasets (e.g., Common Crawl, Wikipedia). \n-Optimize prompt engineering strategies for LLMs and generative models. \n-Collaborate with UX teams to improve conversational AI systems, voice assistants, and multilingual bots. \n\nCareer Path and Opportunities: \nThis internship can lead to roles such as NLP Engineer, Conversational AI Developer, LLM Researcher, or AI Linguistics Specialist. As generative AI \nadoption accelerates, NLP specialists are increasingly sought after across industries including healthtech, edtech, fintech, and legal AI. \n\nSkills and Experience Gained: \n-Language Modeling: Work with BERT, GPT, T5, and other transformer architectures. \n-Linguistic Analysis: Gain exposure to syntactic, semantic, and contextual NLP techniques. \n-Conversational AI: Develop chatbots and dialogue systems using Rasa or LangChain. \n-Prompt Engineering: Learn how to steer LLM outputs using zero-shot, few-shot, and chain-of-thought prompting.", "benefits": "", "requirements": "远程实习：4周/8周/12周", "price12m": "远程实习：\n4周14000元 / 8周16000元/12周18000元", "price3m": "官方offer、推荐信、实习证明、支持背调", "jd": "免费支持CPT，OPT（+100美金）", "note": "否", "type": "美国实习"}, {"industry": "", "company": "", "position": "", "form": "机器学习和神经网络分析师实习生Machine Learning & Neural Network Analyst Intern", "duration": "岗位概述：\n-作为 inGen Dynamics 的机器学习与神经网络分析实习生，您将负责设计、训练和优化深度学习架构，以解决机器人、医疗、安防、教育等多个领域的实际问题。您将与数据科学家及工程师紧密协作，试验从卷积神经网络（CNNs）、循环神经网络（RNNs）到 Transformer 等多种神经网络拓扑结构，并在基于 Origami AI 平台的已部署 AI 系统中评估其性能。\n\n核心职责：\n\n设计并实现针对特定任务（如分类、回归、序列预测）的神经网络\n执行超参数调优、模型评估及性能优化工作\n使用 TensorFlow、PyTorch、Keras 等框架进行模型开发\n分析并可视化模型输出，识别过拟合、欠拟合、梯度消失等问题\n与产品团队和工程团队协作，将模型集成至生产流水线\n\n职业发展路径与机会：\n-该实习岗位是迈向机器学习工程师、AI 系统架构师、深度学习研究员或 MLOps（机器学习运维）专员等职业的重要跳板。您积累的经验具有广泛适用性，可在金融、自主系统、网络安全、生物技术等多个行业发挥价值。\n\n可积累的技能与经验：\n\n模型设计精通：掌握为不同类型数据（图像、时间序列、结构化输入）构建各类神经网络的能力\n训练优化：学习损失函数、优化器、正则化及批归一化的最佳实践\n实验与分析：积累 A/B 测试、交叉验证及学习率调度的实战经验\n部署准备：了解将模型从实验环境（笔记本）推向实际生产部署的全流程要求", "location": "Role Overview: \n-As a Machine Learning & Neural Network Analyst Intern at InGen Dynamics, you will design, train, and optimize deep learning architectures to solve \nreal-world problems across domains such as robotics, healthcare, security, and education. You will work closely with data scientists and engineers to \nexperiment with different neural network topologies—ranging from CNNs and RNNs to transformers—and evaluate their performance in deployed AI \nsystems powered by the Origami AI platform. \n\nKey Responsibilities: \n-Design and implement neural networks tailored to specific tasks (e.g., classification, regression, sequence prediction). \n-Perform hyperparameter tuning, model evaluation, and performance optimization. \n-Use frameworks such as TensorFlow, PyTorch, and Keras for model development. \n-Analyze and visualize model outputs to detect issues like overfitting, underfitting, or vanishing gradients. \n-Collaborate with product and engineering teams to integrate models into production pipelines. \n\nCareer Path and Opportunities: \n-This internship is a stepping stone to careers such as Machine Learning Engineer, AI Systems Architect, Deep Learning Researcher, or MLOps Specialist. \nYou’ll build foundational experience that can be applied in sectors including finance, autonomous systems, cybersecurity, and biotech. \n\nSkills and Experience Gained: \n-Model Design Mastery: Understand how to architect various neural networks for different types of data (images, time series, structured input). \n-Training Optimization: Learn best practices for loss functions, optimizers, regularization, and batch normalization. \n-Experimentation & Analysis: Gain experience with A/B testing, cross-validation, and learning rate scheduling. \n-Deployment Readiness: Learn what it takes to bring a model from notebook to live deploymen", "benefits": "", "requirements": "远程实习：4周/8周/12周", "price12m": "远程实习：\n4周14000元 / 8周16000元/12周18000元", "price3m": "官方offer、推荐信、实习证明、支持背调", "jd": "免费支持CPT，OPT（+100美金）", "note": "否", "type": "美国实习"}, {"industry": "", "company": "", "position": "", "form": "边缘人工智能与模型压缩实习生Edge AI & Model Compression Intern", "duration": "岗位概述：\n-作为 inGen Dynamics 的边缘 AI 与模型压缩实习生，您将专注于优化 AI 模型，使其能在算力和内存有限的边缘设备上高效运行。您将运用量化、剪枝、蒸馏及硬件特定优化技术，将模型部署到 Aido、Sentinel、Carry & Go 等机器人上。该岗位连接软件工程与嵌入式系统，为安全关键型及移动应用场景提供实时、低延迟的智能支持。\n\n核心职责：\n\n使用 TensorRT、ONNX、TFLite 和 OpenVINO 等工具压缩大规模 AI 模型，以适应边缘部署\n实施量化、剪枝和知识蒸馏技术，减小模型体积并缩短推理时间\n针对边缘硬件（Jetson Nano、Coral TPU、树莓派、ARM Cortex）优化神经网络\n从速度、内存占用、精度损失等指标对模型进行性能基准测试\n与机器人团队和硬件团队协作，在实际环境中集成并测试优化后的模型\n\n职业发展路径与机会：\n-该岗位是进入嵌入式 AI、边缘计算、机器人系统工程及 AI 硬件设计领域的理想起点。未来可发展为边缘 AI 工程师、机器学习系统架构师或 AI 硬件优化专家，就职于顶尖 AI 初创公司、芯片制造商或工业自动化企业。\n\n可积累的技能与经验：\n\n模型优化：获得减小模型体积和计算负载的实战经验\n硬件感知 AI 设计：学习在资源受限的多样化设备上部署模型\n嵌入式系统集成：掌握与微控制器和推理加速器协作的能力\n性能基准测试：理解 AI 系统在体积、速度与精度之间的权衡关系", "location": "Role Overview: \n-As an Edge AI & Model Compression Intern at InGen Dynamics, you will work on optimizing AI models to run efficiently on edge devices with limited \nprocessing power and memory. You’ll apply quantization, pruning, distillation, and hardware-specific optimizations to deploy models on robots like Aido, \nSentinel, and Carry & Go. This role bridges software engineering and embedded systems, enabling real-time, low-latency intelligence in safety-critical and \nmobility applications. \n\nKey Responsibilities: \n-Compress large-scale AI models for edge deployment using tools like TensorRT, ONNX, TFLite, and OpenVINO. \n-Implement quantization, pruning, and knowledge distillation to reduce model size and inference time. \n-Optimize neural networks for edge hardware (Jetson Nano, Coral TPU, Raspberry Pi, ARM Cortex). \n-Benchmark models on performance metrics such as speed, memory usage, and accuracy loss. \n-Collaborate with robotics and hardware teams to integrate and test optimized models in live environments. \n\nCareer Path and Opportunities: \n-This role is an excellent launchpad for careers in embedded AI, edge computing, robotics systems engineering, and AI hardware design. It can evolve into \nroles such as Edge AI Engineer, ML Systems Architect, or AI Hardware Optimization Specialist at leading AI startups, chipmakers, or industrial automation \ncompanies. \n\nSkills and Experience Gained: \n-Model Optimization: Hands-on experience with reducing model size and computational load. \n-Hardware-Aware AI Design: Exposure to deploying models across diverse devices with resource constraints. \n-Embedded Systems Integration: Learn to work with micro-controllers and inference accelerators. \n-Performance Benchmarking: Understand the trade-offs between size, speed, and accuracy in AI systems.", "benefits": "", "requirements": "远程实习：4周/8周/12周", "price12m": "远程实习：\n4周14000元 / 8周16000元/12周18000元", "price3m": "官方offer、推荐信、实习证明、支持背调", "jd": "免费支持CPT，OPT（+100美金）", "note": "否", "type": "美国实习"}, {"industry": "", "company": "", "position": "", "form": "应用人工智能分析师实习生Applied Al Analyst Intern", "duration": "岗位概述：\n-作为 inGen Dynamics 的应用 AI 分析实习生，您将助力衔接机器学习理论与实际落地应用，负责将 AI 解决方案直接部署到产品、工作流程及业务运营中。您将与工程、产品、业务等跨职能团队协作，确保 AI 模型为公司旗下智能机器人及平台（包括 Origami AI、Fari、Aido、Senpai）创造实际价值。\n\n核心职责：\n-将训练好的机器学习模型部署并集成至生产环境与 API 中\n-分析具体应用场景需求，推荐合适的 AI 解决方案\n-解决推荐引擎、预测分析、行为建模等实际应用问题\n-构建简单的机器学习原型（分类、聚类、回归），用于内部自动化及决策支持\n-与产品经理和开发人员协作，使 AI 能力与业务目标保持一致\n\n职业发展路径与机会：\n-该实习岗位为进入应用机器学习工程师、AI 解决方案架构师、产品数据科学家或 AI 业务顾问等领域打开大门。对于希望兼顾实操编码与跨领域战略影响的人而言，是理想的职业起点。\n\n可积累的技能与经验：\n-端到端 AI 交付：学习在实际系统中构建、测试和部署模型的全流程\n-业务与 AI 对齐：理解 AI 解决方案如何支撑关键绩效指标（KPIs）及客户价值\n-轻量原型开发：掌握使用 scikit-learn、XGBoost 等工具快速验证机器学习假设的能力\n-跨职能协作：与设计师、营销人员、产品负责人及技术主管紧密配合", "location": "Role Overview: \n-As an Applied AI Analyst Intern at InGen Dynamics, you will help bridge the gap between machine learning theory and real-world implementation. Your \nrole will involve deploying AI solutions directly into products, workflows, and business operations. You’ll collaborate with cross-functional teams—including \nengineering, product, and business units—to ensure that AI models deliver value across our portfolio of intelligent robots and platforms, including Origami \nAI, Fari, Aido, and Senpai. \n\nKey Responsibilities: \n-Deploy and integrate trained ML models into production environments and APIs. \n-Analyze use-case requirements and recommend appropriate AI solutions. \n-Work on applied problems such as recommendation engines, predictive analytics, and behavior modeling. \n-Build simple ML prototypes (classification, clustering, regression) for internal automation and decision support. \n-Collaborate with product managers and developers to align AI capabilities with business goals. \n\nCareer Path and Opportunities: \n-This internship opens doors to roles such as Applied Machine Learning Engineer, AI Solutions Architect, Product Data Scientist, or AI Business \nConsultant. It’s well-suited for those seeking hybrid roles that combine hands-on coding with strategic impact across verticals. \n\nSkills and Experience Gained: \n-End-to-End AI Delivery: Learn to build, test, and deploy models in real-world systems. \n-Business-AI Alignment: Understand how AI solutions support KPIs and customer value. \n-Lightweight Prototyping: Gain speed in rapidly testing ML hypotheses using scikit-learn, XGBoost, etc. \n-Collaboration Across Functions: Work closely with designers, marketers, product owners, and technical leads.", "benefits": "", "requirements": "远程实习：4周/8周/12周", "price12m": "远程实习：\n4周14000元 / 8周16000元/12周18000元", "price3m": "官方offer、推荐信、实习证明、支持背调", "jd": "免费支持CPT，OPT（+100美金）", "note": "否", "type": "美国实习"}, {"industry": "", "company": "", "position": "", "form": "AI模型评估实习生\nAI Model Evaluation Intern", "duration": "岗位概述：\n-作为 inGen Dynamics 的 AI 模型评估实习生，您将专注于机器学习模型部署前后的测试、验证与基准测试工作。这包括评估模型性能、识别偏差、测试边缘场景下的稳健性，以及确保模型符合伦理 AI 标准。您将跨团队参与 AI 模型在老年护理（Fari）、安防（Sentinel）和教育（Senpai）等领域的部署，助力保障模型的准确性、公平性与可靠性。\n\n核心职责：\n-使用标准及定制指标（如精确率、召回率、F1 分数、AUC-ROC）评估模型性能\n-开展压力测试与边缘场景评估，验证模型的稳健性与泛化能力\n-利用人口统计数据或合成测试集进行公平性审计与偏差分析\n-为利益相关方及工程团队生成评估报告与可视化结果\n-参与制定标准化评估流程与质量保障清单\n\n职业发展路径与机会：\n-该实习岗位是迈向机器学习测试工程师、AI 质量保障分析师、负责任 AI 评估师或 MLOps 验证专员等职业的理想起点。同时，它也为专注于学术或监管领域中 AI 安全与公平性的研究岗位奠定基础。\n\n可积累的技能与经验：\n-性能指标精通：学会超越准确率，从实际应用价值角度评估机器学习模型\n-偏差与公平性测试：掌握检测、解读并缓解模型偏差的方法\n-压力测试与稳健性：接触对抗性测试、数据漂移检测及分布偏移下的验证技术\n-文档与沟通：培养撰写可解释、可执行的评估报告的能力", "location": "Role Overview: \n-As an AI Model Evaluation Intern at InGen Dynamics, you will focus on testing, validating, and benchmarking machine learning models before and after \ndeployment. This includes assessing model performance, identifying biases, measuring robustness under edge-case scenarios, and ensuring compliance \nwith ethical AI standards. You will work across teams deploying AI models in eldercare (Fari), surveillance (Sentinel), and education (Senpai), helping \nensure their accuracy, fairness, and reliability. \n\nKey Responsibilities: \n-Evaluate model performance using standard and custom metrics (e.g., precision, recall, F1 score, AUC-ROC). \n-Conduct stress tests and edge-case evaluations for robustness and generalization. \n-Perform fairness audits and bias analysis using demographic data or synthetic test sets. \n-Generate evaluation reports and visualizations for stakeholders and engineering teams. \n-Contribute to the development of standardized evaluation pipelines and quality assurance checklists. \n\nCareer Path and Opportunities: \n-This internship is ideal for future roles such as ML Test Engineer, AI QA Analyst, Responsible AI Evaluator, or MLOps Validation Specialist. It is also a \nstepping stone to research roles focused on AI safety and fairness in academic or regulatory contexts. \n\nSkills and Experience Gained: \n-Performance Metrics Mastery: Learn to assess ML models beyond accuracy, focusing on real-world utility. \n-Bias & Fairness Testing: Understand how to detect, interpret, and mitigate model bias. \n-Stress Testing & Robustness: Gain exposure to adversarial testing, data drift detection, and validation under distribution shifts. \n-Documentation & Communication: Learn how to write explainable and actionable evaluation reports.", "benefits": "", "requirements": "远程实习：4周/8周/12周", "price12m": "远程实习：\n4周14000元 / 8周16000元/12周18000元", "price3m": "官方offer、推荐信、实习证明、支持背调", "jd": "免费支持CPT，OPT（+100美金）", "note": "否", "type": "美国实习"}, {"industry": "", "company": "inGen Dynamics Inc.\n【限时促销】", "position": "", "form": "量化分析 Quantitative Analysis", "duration": "岗位概述：\n-作为 inGen Dynamics 的量化分析专员，您将通过开发和优化金融模型、执行统计分析及应用计量经济学方法，为战略决策提供支持。您将处理海量数据集，生成可落地的洞察，助力制定战略举措并管理风险。\n\n核心职责：\n-开发并完善金融模型，用于预测趋势及评估资产表现\n-使用 Excel、Python 或 R 等工具开展统计与计量经济学分析\n-编制详细报告并制作可视化内容，确保洞察得到有效传达\n-与高级分析师及跨职能团队协作，使分析结果与战略目标保持一致\n\n职业发展路径与机会：\n-该岗位是迈向量化分析师、金融分析师、数据科学家或风险经理等职业的起点。您培养的量化技能在顶尖投资银行（如高盛、摩根士丹利）、顶级咨询公司（如麦肯锡、波士顿咨询）及全球金融机构中备受重视。\n\n可积累的技能与经验：\n-精通金融建模与统计分析，具备高级应用能力\n-掌握计量经济学方法，积累数据解读的实战经验\n-通过实际分析工作，提升问题解决与批判性思维能力\n-增强与跨学科团队协作及沟通的能力", "location": "Role Overview: \nAs a Quantitative Analysis Employee at InGen Dynamics, you support strategic decision-making by developing and refining financial models, \nperforming statistical analyse <script>
const KB = JSON.parse(document.getElementById('kb-data').textContent);
const API_KEY = 'sk-8eb1dfe1032e457c9ee19dcdccb247e5';

function init() {
  const inds = [...new Set(KB.map(i=>i.industry).filter(Boolean))].sort();
  const types = [...new Set(KB.map(i=>i.type).filter(Boolean))].sort();
  inds.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; document.getElementById('sel-industry').appendChild(o); });
  types.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; document.getElementById('sel-type').appendChild(o); });
  search();
}

function switchPage(btn, n) {
  document.getElementById('page-'+n).classList.add('active');
  document.querySelectorAll('.nbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(n==='search') search();
}

function onKey(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} }
function resize(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,120)+'px'; }
function setInput(t){ const el=document.getElementById('input'); el.value=t; resize(el); el.focus(); }

function send() {
  const el=document.getElementById('input');
  const txt=el.value.trim();
  if(!txt) return;
  addMsg(txt,'user');
  el.value='';
  el.style.height='auto';
  document.getElementById('typing').style.display='flex';
  scrollBottom();
  analyze(txt);
}

function addMsg(text,type) {
  const div=document.createElement('div');
  div.className='msg '+type;
  div.textContent=text;
  document.getElementById('msgs').insertBefore(div,document.getElementById('typing'));
  scrollBottom();
}

function scrollBottom() {
  document.getElementById('msgs').scrollTop=document.getElementById('msgs').scrollHeight;
}

async function analyze(text) {
  try {
    const cands=filter(text);
    if(cands.length===0) {
      document.getElementById('typing').style.display='none';
      addMsg('抱歉，暂无完全匹配的岗位。请尝试：\n• 调整城市（北上广深）\n• 改变行业关键词（金融/科技/咨询）\n• 放宽实习形式（实地/远程）','bot');
      return;
    }
    // 构建更丰富的候选信息
    const list=cands.slice(0,6).map((item,i)=>{
      const name=item.company||item.position||'科研助理';
      const pos=item.position||item.company||'研究助理';
      const jd=(item.jd||'暂无描述').substring(0,200).replace(/\n/g,' ');
      const loc=item.location||'待定';
      const form=item.form||'实地';
      const dur=item.duration||'面议';
      const req=item.requirements||'简历评估+面试';
      const ben=(item.benefits||'实习证明/推荐信').substring(0,60);
      return`【${i+1}】${name}
岗位：${pos}
地点：${loc} | 形式：${form} | 时长：${dur}
申请要求：${req}
项目收获：${ben}
工作内容：${jd}`;
    }).join('\n\n');

    const systemPrompt=`你是星辉实习平台的专业顾问，擅长精准匹配学员需求与实习岗位。

【回复风格】
- 专业、亲切、有温度
- 像经验丰富的人脉顾问在帮助朋友
- 信息层次分明，重点突出

【输出格式】
━━━━━━━━━━━━━━━━━━━━
开头：1-2句总结需求，整体亮点
━━━━━━━━━━━━━━━━━━━━

▌ 方向一：公司名 - 岗位名
   城市 | 类型 | 时长
   核心内容：（从JD提炼，详细描述工作内容）
   技能要求：（从requirements提炼，需要什么背景/能力）
   适合人群：（适合什么专业的学生）

▌ 方向二：...
━━━━━━━━━━━━━━━━━━━━
结尾引导语

【重要规则】
- 只推荐候选岗位中的，禁止编造
- 不显示价格
- 突出差异化（不同公司/行业/形式）
- 推荐3-5个最匹配的
- 绝对禁止：不要用任何Markdown格式（**加粗**、*斜体*、#标题、-列表）
- 只能用纯文本符号：━━━ ▌ · ：（）
- 每个岗位要写详细：核心内容、技能要求、适合人群`;

    const resp=await fetch('https://api.deepseek.com/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},
      body:JSON.stringify({
        model:'deepseek-chat',
        messages:[
          {role:'system',content:systemPrompt},
          {role:'user',content:'客户需求：'+text+'\n\n【可选岗位】：\n'+list}
        ],
        temperature:0.5,
        max_tokens:1200
      })
    });
    const data=await resp.json();
    document.getElementById('typing').style.display='none';
    if(data.error){ addMsg('💡 为您推荐：\n\n'+fallback(text),'bot'); return; }

    // 清理Markdown格式
    let reply=data.choices[0].message.content.trim();
    reply=reply.replace(/\*\*(.+?)\*\*/g,'$1');  // 去掉**加粗**
    reply=reply.replace(/\*(.+?)\*/g,'$1');      // 去掉*斜体*
    reply=reply.replace(/^#+\s+/gm,'');           // 去掉#标题
    reply=reply.replace(/^[-*+]\s+/gm,'· ');     // 列表改为 ·
    reply=reply.replace(/`(.+?)`/g,'$1');        // 去掉`代码`

    addMsg(reply,'bot');
  } catch(err) {
    console.error(err);
    document.getElementById('typing').style.display='none';
    addMsg('💡 为您推荐：\n\n'+fallback(text),'bot');
  }
}

function filter(text) {
  const t=text.toLowerCase();
  const CITIES=['北京','上海','深圳','广州','杭州','成都','南京','武汉','西安','苏州','天津'];
  const cities=CITIES.filter(c=>t.includes(c));

  // 扩展行业关键词
  const keywords=[
    ['投行',['投行','ibd','并购','承销','股权','债券','行研','券商']],
    ['金融',['金融','银行','证券','基金','信托','保险','资管','期货','投资']],
    ['咨询',['咨询','顾问','麦肯锡','贝恩','波士顿']],
    ['四大',['四大会计师事务所','普华永道','德勤','安永','毕马威','四大']],
    ['科技',['科技','技术','互联网','计算机','软件','AI','数据','算法','开发']],
    ['市场',['市场','营销','传媒','广告','品牌','运营','新媒体','电商']],
    ['化学',['化学','化工','材料','生物','医药','制药','医疗','实验室','科研院所']],
    ['法律',['法律','法务','合规','律师']],
    ['制造',['制造','工业','生产','供应链','质量']]
  ];

  let scored=KB.map(item=>{
    let s=0;
    const allText=(item.company||'')+(item.position||'')+(item.industry||'')+(item.jd||'')+(item.type||'').toLowerCase();

    // 城市匹配
    if(cities.length>0){
      if(item.location&&cities.some(c=>item.location.includes(c))) s+=25;
    }

    // 实习形式匹配
    if(t.includes('远程')&&(item.form||'').includes('远程')) s+=10;
    if(t.includes('实地')&&(item.form||'').includes('实地')) s+=10;

    // 关键词匹配
    keywords.forEach(([cat,words])=>{
      if(words.some(w=>t.includes(w))){
        if(words.some(w=>allText.includes(w))) s+=15;
      }
    });

    // 公司精确匹配
    const companyUpper=(item.company||'').toUpperCase();
    if(t.includes('中科院')&&companyUpper.includes('中科院')) s+=30;
    if(t.includes('中金')&&companyUpper.includes('中金')) s+=25;
    if(t.includes('华泰')&&companyUpper.includes('华泰')) s+=25;

    return{item,s};
  });
  scored.sort((a,b)=>b.s-a.s);
  return scored.filter(m=>m.s>5).slice(0,15).map(m=>m.item);
}

function fallback(text) {
  const cands=filter(text);
  if(cands.length===0) return '暂无匹配，请尝试其他关键词。';
  let r='';
  cands.slice(0,6).forEach(item=>{ r+='▌'+item.company+' - '+item.position+'\n   '+(item.location||'待定')+' | '+(item.type||'')+'\n\n'; });
  return r+'💬 点击【产品搜索】查看更多。';
}

function search() {
  const type=document.getElementById('sel-type').value;
  const ind=document.getElementById('sel-industry').value;
  const loc=document.getElementById('sel-location').value;
  let res=KB.filter(item=>{
    if(type&&item.type!==type) return false;
    if(ind&&item.industry!==ind) return false;
    if(loc&&item.location&&!item.location.includes(loc)) return false;
    return true;
  });
  document.getElementById('count').textContent='共 '+res.length+' 个结果';
  document.getElementById('cards').innerHTML=res.slice(0,30).map(item=>
    '<div class="card" onclick="showDetail('+KB.indexOf(item)+')">'+
    '<div class="card-co">'+item.company+'</div>'+
    '<div class="card-pos">'+item.position+'</div>'+
    '<div><span class="tag">'+(item.type||'')+'</span><span class="tag">'+(item.form||'')+'</span></div>'+
    '<div class="card-meta">'+(item.location||'待定')+' · '+(item.duration||'')+'</div>'+
    '</div>'
  ).join('');
}

function showDetail(idx) {
  const item=KB[idx];
  if(!item) return;
  document.getElementById('drawer-title').textContent=item.company;
  document.getElementById('drawer-body').innerHTML=
    '<div class="row"><div class="row-lbl">岗位</div><div class="row-val">'+(item.position||'-')+'</div></div>'+
    '<div class="row"><div class="row-lbl">行业</div><div class="row-val">'+(item.industry||'-')+'</div></div>'+
    '<div class="row"><div class="row-lbl">类型</div><div class="row-val">'+(item.type||'-')+'</div></div>'+
    '<div class="row"><div class="row-lbl">形式</div><div class="row-val">'+(item.form||'-')+'</div></div>'+
    '<div class="row"><div class="row-lbl">城市</div><div class="row-val">'+(item.location||'-')+'</div></div>'+
    '<div class="row"><div class="row-lbl">时长</div><div class="row-val">'+(item.duration||'-')+'</div></div>'+
    '<div class="row"><div class="row-lbl">收获</div><div class="row-val">'+(item.benefits||'-')+'</div></div>'+
    '<div class="row"><div class="row-lbl">要求</div><div class="row-val">'+(item.requirements||'-')+'</div></div>'+
    '<div class="row"><div class="row-lbl">JD</div><div class="row-val">'+((item.jd||'-').replace(/\n/g,'<br>'))+'</div></div>'+
    (item.note?'<div class="row"><div class="row-lbl">备注</div><div class="row-val">'+item.note+'</div></div>':'');
  document.getElementById('drawer').classList.add('open');
}

function closeDrawer(){ document.getElementById('drawer').classList.remove('open'); }

init();
</script>
</body>
</html>
